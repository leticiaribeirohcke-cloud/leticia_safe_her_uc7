<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHer - Configurações</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="pagina-contatos">

        <a href="pagina_sos.html" class="voltar">
            ←
        </a>

        <h1>Configurações</h1>

        <section class="lista-contatos">

            <div class="contato">

                <div>

                    <h3>Notificações</h3>

                    <p>Ativar notificações do aplicativo</p>

                </div>

                <input
                    type="checkbox"
                    id="notificacoes">

            </div>

            <div class="contato">

                <div>

                    <h3>Compartilhamento Automático</h3>

                    <p>Enviar localização automaticamente</p>

                </div>

                <input
                    type="checkbox"
                    id="compartilhamento">

            </div>

        </section>

        <button
            id="btnSalvarConfig"
            class="btn-adicionar">

            SALVAR CONFIGURAÇÕES

        </button>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
