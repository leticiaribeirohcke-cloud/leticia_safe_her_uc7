<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeHer - Cadastro</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="pagina-cadastro">

        <!-- Voltar -->
        <div class="voltar">
            <a href="pagina_inicial.html">←</a>
        </div>

        <!-- Cabeçalho -->
        <section class="cabecalho-cadastro">

            <img
                src="img/safe-her3.png"
                alt="SafeHer"
                class="foto-perfil">

            <h1>Crie sua conta</h1>

            <p>Sua segurança começa aqui.</p>

        </section>

        <!-- Formulário -->
        <form
            id="formCadastro"
            class="form-cadastro">

            <input
                type="text"
                id="nome"
                placeholder="Nome completo">

            <input
                type="email"
                id="emailCadastro"
                placeholder="Digite seu e-mail">

            <input
                type="password"
                id="senhaCadastro"
                placeholder="Digite sua senha">

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirme sua senha">

            <input
                type="tel"
                id="telefone"
                placeholder="Telefone">

            <div class="termos">

                <input
                    type="checkbox"
                    id="aceiteTermos">

                <label for="aceiteTermos">

                    Eu concordo com os

                    <a href="pagina_termos_de_uso.html">
                        Termos de Uso
                    </a>

                    e com a

                    <a href="pagina_politica_de_privacidade.html">
                        Política de Privacidade
                    </a>

                </label>

            </div>

            <div class="area-botao">

                <a href="pagina_sos.html" class="btn-cadastro">

                    CRIAR CONTA

                </a>

            </div>

        </form>

        <div class="separador">

            <span>OU</span>

        </div>

        <div class="google-login">

            <button
                type="button"
                id="btnGoogleCadastro">

                Cadastrar com Google

            </button>

        </div>

        <div class="login-link">

            <p>

                Já possui conta?

                <a href="pagina_login.html">

                    Entrar

                </a>

            </p>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
