<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHer - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="pagina-cadastro">

        <!-- Botão voltar -->
        <div class="voltar">
            <a href="pagina_inicial.html">←</a>
        </div>

        <!-- Foto -->
        <section class="cabecalho-cadastro">
            <img src="C:\Users\Aluno\OneDrive\Documentos\leticia_safe_her_uc7\img\safe-her3.png" alt="Perfil" class="foto-perfil">
            <h1>Crie sua conta</h1>
            <p>Sua segurança começa aqui</p>

        </section>

        <!-- Formulário -->
        <form class="form-cadastro">
            <input
                type="text"
                placeholder="Nome Completo"
                required>

            <input
                type="email"
                placeholder="Digite seu email"
                required>

            <input
                type="password"
                placeholder="Digite sua senha"
                required>

            <input
                type="password"
                placeholder="Confirme sua senha"
                required>

            <input
                type="tel"
                placeholder="Digite seu telefone"
                required>

            <div class="termos">
                <input type="checkbox" required>
                <label>
                    Eu concordo com os
                    <a href="#">Termos de Uso</a>
                    e
                    <a href="#">Política de Privacidade</a>
                </label>
            </div>

            <div class="area-botao">
                <button type="submit" class="btn-cadastro">
                    CRIAR CONTA
                </button>
            </div>
        </form>

        <div class="separador">
            <span>OU</span>
        </div>

        <div class="google-login">
            <button type="button">
                Entrar com o Google
            </button>
        </div>

        <div class="login-link">
            <p>
                Já possui conta?
                <a href="pagina_login.html">Entrar</a>
            </p>

        </div>
    </main>

</body>
</html>
