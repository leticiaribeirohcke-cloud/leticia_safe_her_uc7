<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha - SafeHer</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="pagina-recuperar">

        <div class="voltar">
            <a href="pagina_login.html">←</a>
        </div>

        <section class="cabecalho-cadastro">

            <h1 class="titulo-recuperar">Recuperar Senha</h1>

            <p>
                Informe o e-mail utilizado no cadastro.
            </p>

        </section>

        <form id="formRecuperarSenha" class="form-cadastro">

            <label for="emailRecuperacao">
                E-mail
            </label>

            <input
                type="email"
                id="emailRecuperacao"
                placeholder="Digite seu e-mail"
                required>

            <div class="area-botao">

                <button
                    type="submit"
                    class="btn-cadastro">

                    RECUPERAR SENHA

                </button>

            </div>

        </form>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
