<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeHer - Adicionar Contato</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main class="pagina-adicionar-contato">

    <a href="pagina_contatos.html" class="voltar">

        ←

    </a>

    <section class="cabecalho-contato">

        <h1>Adicionar Contato</h1>

        <p>

            Cadastre um contato de confiança.

        </p>

    </section>

    <form
        id="formContato"
        class="form-cadastro">

        <input
            type="text"
            id="nomeContato"
            placeholder="Nome do contato">

        <input
            type="tel"
            id="telefoneContato"
            placeholder="Telefone">

        <input
            type="email"
            id="emailContato"
            placeholder="E-mail (opcional)">

        <button
            type="submit"
            class="btn-cadastro">

            SALVAR CONTATO

        </button>

    </form>

</main>

<script src="js/script.js"></script>

</body>

</html>
